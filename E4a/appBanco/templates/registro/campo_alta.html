            <rect x="3" y="5" width="18" height="14" rx="2"/>

            <path d="M4 3h4l2 5-3 2a15 15 0 0 0 7 7l2-3 5 2v4c0 .6-.4 1-1 1C11 21 3 13 3 4c0-.6.4-1 1-1Z"/>

            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 10h18M7 15h4"/>

            <rect x="5" y="10" width="14" height="11" rx="2"/>
