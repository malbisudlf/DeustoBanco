{% extends "base.html" %}

{% block title %}Clientes{% endblock %}

{% block content %}
<h1>Clientes</h1>

<ul>
    {% for cliente in clientes_listado %}
        <li>
            <a href="{% url 'detalle_cliente' cliente.id %}">
                {{ cliente.nombre }} {{ cliente.apellidos }}
            </a>
        </li>
    {% empty %}
        <li>No hay clientes registrados.</li>
    {% endfor %}
</ul>
{% endblock %}
