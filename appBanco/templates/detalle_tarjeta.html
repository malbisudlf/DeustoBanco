<h1>{{ tarjeta.numero }}</h1>

<p>Cuenta: <a href="{% url 'detalle_cuenta' tarjeta.cuenta.pk %}">{{ tarjeta.cuenta.iban }}</a></p>
<p>Tipo: {{ tarjeta.get_tipo_display }}</p>
<p>Caducidad: {{ tarjeta.fecha_caducidad }}</p>
<p>Estado: {% if tarjeta.activa %}Activa{% else %}Bloqueada{% endif %}</p>
<p>Límite diario: {{ tarjeta.limite_diario }} €</p>
